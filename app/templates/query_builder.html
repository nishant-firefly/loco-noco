<!DOCTYPE html>
<html>
<head>
    <title>Graphical Query Builder</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 800px; margin: auto; }
        .form-group { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Graphical Query Builder</h1>
        <form id="query-builder-form">
            <div class="form-group">
                <label for="persona">Persona:</label>
                <select id="persona">
                    <option value="guest">Guest</option>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="form-group">
                <label for="table">Table:</label>
                <input type="text" id="table" placeholder="Enter table name" />
            </div>
            <div class="form-group">
                <label for="columns">Columns (comma-separated):</label>
                <input type="text" id="columns" placeholder="Enter columns" />
            </div>
            <div class="form-group">
                <label for="conditions">Conditions (JSON):</label>
                <textarea id="conditions" rows="4" cols="50" placeholder='{"id": 1}'></textarea>
            </div>
            <button type="button" onclick="previewQuery()">Preview Query</button>
            <button type="button" onclick="executeQuery()">Execute Query</button>
        </form>

        <h2>SQL Preview:</h2>
        <pre id="sql-preview"></pre>

        <h2>Query Result:</h2>
        <pre id="query-result"></pre>
    </div>

    <script>
        function previewQuery() {
            const data = collectQueryData();
            fetch("/query-preview", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("sql-preview").textContent = data.query || data.error;
            });
        }

        function executeQuery() {
            const data = collectQueryData();
            fetch("/query", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("query-result").textContent = JSON.stringify(data, null, 2);
            });
        }

        function collectQueryData() {
            return {
                persona: document.getElementById("persona").value,
                request: {
                    operation: "select",
                    table: document.getElementById("table").value,
                    columns: document.getElementById("columns").value.split(","),
                    clause: JSON.parse(document.getElementById("conditions").value || "{}")
                }
            };
        }
    </script>
</body>
</html>
